name: Build pdf2cad EXE (Windows)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat

      - name: Cache vcpkg installed
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-${{ hashFiles('vcpkg.json') }}

      - name: Configure (vcpkg manifest mode)
        run: |
          cmake -B build -S . `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_INSTALLED_DIR="${{ github.workspace }}/build/vcpkg_installed" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Collect EXE + runtime DLLs
        run: |
          mkdir dist
          copy build\Release\pdf2cad.exe dist\
          copy build\vcpkg_installed\x64-windows\bin\*.dll dist\
          echo "--- dist contents ---"
          dir dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf2cad-exe
          path: dist\*
